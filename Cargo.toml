[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

# Every crate version lives here. Member crates reference these with
# `dep.workspace = true` so the two crates can never drift apart.
[workspace.dependencies]
# --- Graphics ---
# wgpu 30 targets WebGPU on wasm32 and Vulkan/D3D12/Metal natively, which is
# what keeps a future desktop build reachable from the same renderer code.
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }

# --- Diagnostics ---
log = "0.4"
thiserror = "2.0"

# --- Web / wasm bindings ---
# wasm-bindgen is pinned EXACTLY. The crate embeds a schema version into the
# emitted module and the `wasm-bindgen` CLI refuses anything it does not
# recognise, so crate and CLI must agree to the patch level. Installed CLI is
# 0.2.127 (`wasm-bindgen --version`). If this pin is raised, the CLI must be
# reinstalled to match:
#   cargo install -f wasm-bindgen-cli --version <new>
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"
web-sys = "0.3.104"
console_log = "1.1"
console_error_panic_hook = "0.1"

# --- Internal ---
island_core = { path = "crates/island_core" }

[profile.release]
lto = true
codegen-units = 1

# Graphics crates are unusably slow when compiled without optimisation, but we
# still want debug info for our own code. Optimise dependencies only, so a
# debug build of the game stays debuggable while wgpu stays fast.
[profile.dev.package."*"]
opt-level = 2
